# Configuration Nginx pour crypto55.hazyhaar.fr
server {
    listen 80;
    listen [::]:80;
    server_name crypto55.hazyhaar.fr;

    # Redirection HTTPS automatique certbot / ACME
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crypto55.hazyhaar.fr;

    ssl_certificate /etc/letsencrypt/live/crypto55.hazyhaar.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crypto55.hazyhaar.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/crypto55_access.log;
    error_log /var/log/nginx/crypto55_error.log;

    # Reverse proxy vers le service local Go crypto55 web
    location / {
        proxy_pass http://127.0.0.1:8555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts adaptés aux calculs OneStep et RPC
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
